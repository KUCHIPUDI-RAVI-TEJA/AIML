<template>
    <lightning-card title="Summarize Files" icon-name="standard:file">
        <div class="slds-m-around_medium">

            <template lwc:if={hasAttachments}>
                <lightning-datatable
                    key-field="Id"
                    data={attachments}
                    columns={columns}
                    onrowselection={handleRowSelection}>
                </lightning-datatable>
            </template>

            <template lwc:else>
                <p class="slds-text-color_weak">No files (Attachments) found on this record.</p>
            </template>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Summarize Selected"
                    title="Summarize Selected"
                    onclick={handleSummarize}
                    disabled={isSummarizeDisabled}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button
                    variant="neutral"
                    label="Clear"
                    title="Clear"
                    onclick={handleClear}
                    disabled={isLoading}>
                </lightning-button>
            </div>

            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Generating summary" size="medium"></lightning-spinner>
            </template>

            <template lwc:if={hasSummary}>
                <div class="slds-m-top_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Summary</h3>
                    <div class="summary-container">
                        <lightning-formatted-rich-text value={summary}></lightning-formatted-rich-text>
                    </div>
                </div>
            </template>

            <template lwc:if={hasError}>
                <div class="slds-m-top_medium">
                    <lightning-icon icon-name="utility:error" size="small" alternative-text="Error" class="slds-text-color_error"></lightning-icon>
                    <span class="slds-text-color_error slds-m-left_x-small">{errorMessage}</span>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
